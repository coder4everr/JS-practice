<!DOCTYPE html>
<html>
<head>
<title>Page Title</title>
</head>
<body>

<table>
<tr>
	<th>Name</th>
    <th>Animal</th>
    <th>Quantity</th>
    <th>Rate</th>
    <th>Days</th>
    <th>Total</th>
	<th>Grand Total</th>
</tr>
<tr>
	<td>Abu G</td>
    <td>Buffalo</td>
    <td class='ab'>0.5KG</td>
    <td class=cd>190/KG</td>
    <td class=ef>31</td>
    <td class=gh></td>
</tr>
<tr>
	<td>Faisal Bhai</td>
    <td>Buffalo</td>
    <td class='ab'>2KG</td>
    <td class=cd>190/KG</td>
    <td class=ef>31</td>
    <td class=gh></td>
</tr>
<tr>
	<td>Hamid</td>
    <td>Buffalo</td>
    <td class='ab'>1KG</td>
    <td class=cd>190/KG</td>
    <td class=ef>31</td>
    <td class=gh></td>
</tr>
<tr>
	<td>Hamid</td>
    <td>Cow</td>
    <td class='ab'>0.75KG</td>
    <td class=cd>180/KG</td>
    <td class=ef>31</td>
    <td class=gh></td>
</tr>

</table>
<script>
function calculateTotals() {
  const qty = document.getElementsByClassName('ab');
  const rate = document.getElementsByClassName('cd');
  const days = document.getElementsByClassName('ef');
  const total = document.getElementsByClassName('gh');


  for (let i = 0; i < qty.length; i++) {
    const q = parseFloat(qty[i].innerText);   // 0.5KG → 0.5
    const r = parseFloat(rate[i].innerText);  // 190/KG → 190
    const d = parseFloat(days[i].innerText);  // 31 → 31

    total[i].innerText = q * r * d;
  }
}

calculateTotals();

</script>



</body>
</html>
